<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件分享 - 团队云盘</title>
<style>
* { box-sizing:border-box; }
body { min-height:100vh; margin:0; display:grid; place-items:center; padding:20px; background:#f3f5f9; color:#253247; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.card { width:min(420px,100%); padding:30px; border:1px solid #e4e8ef; border-radius:14px; background:#fff; box-shadow:0 10px 32px #1c2d4712; }
.brand { margin-bottom:22px; color:#3158db; font-size:13px; font-weight:600; letter-spacing:.04em; }
h1 { margin:0 0 8px; font-size:22px; }
.description { margin:0 0 22px; color:#687184; font-size:13px; line-height:1.6; }
label { display:block; margin-bottom:7px; color:#4b5566; font-size:13px; }
input { width:100%; height:44px; padding:0 12px; border:1px solid #d8deea; border-radius:8px; font:inherit; letter-spacing:.16em; text-transform:uppercase; }
input:focus-visible,button:focus-visible { outline:2px solid #3158db; outline-offset:2px; }
button { width:100%; height:44px; margin-top:12px; border:0; border-radius:8px; background:#3158db; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
button:hover { background:#2649c2; }
button:disabled { opacity:.65; cursor:wait; }
.message { min-height:20px; margin:12px 0 0; color:#6b7484; font-size:13px; line-height:1.5; }
.message.error { color:#c43832; }
.hint { margin-top:16px; padding-top:13px; border-top:1px solid #edf0f4; color:#9299a6; font-size:11px; line-height:1.55; }
@media (max-width:480px) { .card { padding:24px 20px; } }
</style>
</head>
<body>
<main class="card">
  <div class="brand">📁 团队云盘</div>
  <h1>文件分享</h1>
  <p class="description">请输入分享者提供的 8 位提取码，验证后将开始下载。</p>
  <form id="shareForm">
    <label for="shareCode">文件提取码</label>
    <input id="shareCode" name="code" type="text" minlength="8" maxlength="16" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required>
    <button id="submitButton" type="submit">验证并下载</button>
  </form>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <p class="hint">分享链接会在设定时间后失效。提取码请通过单独渠道发送给对方。</p>
</main>
<script>
const path = window.location.pathname;
const sharePathIndex = path.lastIndexOf('/s/');
const BASE = sharePathIndex > 0 ? path.slice(0, sharePathIndex) : '';
const token = path.slice(path.lastIndexOf('/') + 1);
const form = document.getElementById('shareForm');
const button = document.getElementById('submitButton');
const message = document.getElementById('message');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const code = document.getElementById('shareCode').value.trim().replace(/\s+/g, '').toUpperCase();
  if (code.length < 8) { message.textContent = '请输入完整的 8 位提取码'; message.classList.add('error'); return; }
  button.disabled = true;
  button.textContent = '正在验证…';
  message.classList.remove('error');
  message.textContent = '';
  try {
    const response = await fetch(BASE + '/api/share/' + encodeURIComponent(token) + '/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify({ code }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '验证失败');
    message.textContent = '提取码正确，正在开始下载…';
    window.location.href = BASE + '/api/shared-download/' + encodeURIComponent(data.grant);
  } catch (error) {
    message.textContent = error.message || '网络错误，请重试';
    message.classList.add('error');
  } finally {
    button.disabled = false;
    button.textContent = '验证并下载';
  }
});
</script>
</body>
</html>
